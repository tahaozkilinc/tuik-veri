[project]
name = "tuik-veri"
version = "0.1.0"
description = "TÜİK dış ticaret verisini günlük çeken, Supabase'e yükleyen ve canlı dashboard'da gösteren pipeline"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.48.0",
    "supabase==2.9.1",
    "pyyaml==6.0.2",
]

[tool.setuptools]
packages = ["scraper", "loader", "reports"]
