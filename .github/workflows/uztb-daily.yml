name: Daily UZTB Price Fetch

on:
  schedule:
    # 15:37 UTC = 18:37 TR (TR daimi UTC+3, DST yok) — salon kapandıktan
    # sonra, günün özeti kesinleşmişken. Her çalıştırma kaynağın ~1 aylık
    # bülten penceresinin tamamını yeniden yazdığı için GH Actions'ın
    # zamanlanmış görev gecikmesi (bazen saatlerce) veri kaybettirmez.
    # Hafta sonu işlem yapılmıyor, bu yüzden sadece Pzt-Cuma çalışıyor.
    - cron: "37 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase==2.31.0

      - name: Fetch + load + verify UZTB daily bulletin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m uztb.run
