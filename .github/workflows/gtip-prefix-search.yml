name: GTİP Prefix Search (debug)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium

      - name: Search GTİP codes by prefix (soybean oil 1507), no writes
        run: python scripts/gtip_prefix_search.py 1507
