name: Daily TCMB USD/TRY Rate Fetch

on:
  schedule:
    # TCMB günlük kuru TR saatiyle ~15:30'da yayınlanır, kesin olsun diye
    # 16:00 UTC = 19:00 Türkiye saati'nde çekiyoruz (TR daimi UTC+3, DST yok).
    # Hafta sonu TCMB yayın yapmıyor, bu yüzden sadece Pzt-Cuma çalışıyor.
    - cron: "0 16 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Tek bir günü çek (YYYY-MM-DD), boş bırakılırsa bugün"
        required: false
        default: ""
      backfill_days:
        description: "Son N günü tek tek çek (1 yıllık geçmiş doldurmak için 365 yazın)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase==2.31.0

      - name: Fetch + load TCMB USD/TRY rate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TCMB_DATE: ${{ github.event.inputs.date }}
          TCMB_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: |
          if [ -n "$TCMB_BACKFILL_DAYS" ] && [ "$TCMB_BACKFILL_DAYS" != "0" ]; then
            python -m tcmb.run --backfill-days "$TCMB_BACKFILL_DAYS"
          elif [ -n "$TCMB_DATE" ]; then
            python -m tcmb.run --date "$TCMB_DATE"
          else
            python -m tcmb.run
          fi
