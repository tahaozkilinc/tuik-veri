name: Daily KTB Bulletin Fetch

on:
  schedule:
    # 2026-10-19'da bulunan hata: KTB günlük bülteni aynı günün akşamı GEÇ
    # saatte (gözlemlenen: ~23:30 TR civarı, bazen daha geç) yayınlanıyor —
    # eskiden burada 15:00 UTC/18:00 TR'de "bugünü" istiyorduk, bu da hep
    # yayından ÖNCE yakalanıp 0 satır dönüyordu (ve bir daha denenmediği için
    # o gün kalıcı eksik kalıyordu). Artık her sabah erken saatte "dünü"
    # istiyoruz — 04:00 UTC = 07:00 TR, o saatte dünün bülteni kesinleşmiş
    # oluyor. Hafta sonu/tatil günleri ktb.run zaten boş liste alıp sessizce
    # atlıyor, bu yüzden her gün çalıştırmak zararsız (Pazartesi sabahı
    # Pazar'ı, Cumartesi sabahı Cuma'yı vb. ister).
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Tek bir günü çek (YYYY-MM-DD), boş bırakılırsa dün"
        required: false
        default: ""
      backfill_days:
        description: "Son N günü tek tek çek (1 yıllık geçmiş doldurmak için 365 yazın)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase==2.31.0

      - name: Fetch + parse + load KTB bulletin
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KTB_DATE: ${{ github.event.inputs.date }}
          KTB_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: |
          if [ -n "$KTB_BACKFILL_DAYS" ] && [ "$KTB_BACKFILL_DAYS" != "0" ]; then
            python -m ktb.run --backfill-days "$KTB_BACKFILL_DAYS"
          elif [ -n "$KTB_DATE" ]; then
            python -m ktb.run --date "$KTB_DATE"
          else
            python -m ktb.run
          fi
