name: Research Probe (temporary)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: TURIB products
        run: python scripts/turib_products_probe.py
      - name: Install Playwright
        run: pip install playwright==1.48.0 && playwright install --with-deps chromium
      - name: UZTB network capture
        run: python scripts/uztb_network_probe.py
