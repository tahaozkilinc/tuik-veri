name: Research Probe (temp, debug)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium

      - name: Verify commodity toggle removed
        run: python scripts/verify_commodity_toggle_removed.py
