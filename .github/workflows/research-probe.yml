name: research-probe

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Çalıştırılacak geçici betik"
        required: false
        default: "scripts/probe_etb.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install supabase==2.31.0 playwright && python -m playwright install --with-deps chromium
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python "${{ github.event.inputs.script }}"
