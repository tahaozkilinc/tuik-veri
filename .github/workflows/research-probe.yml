name: Research Probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run 5-year history probe
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/five_year_probe.py
