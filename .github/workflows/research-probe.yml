name: Research Probe (temp, debug)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Ayçiçek product names (PTB/ÇTB/UZTB)
        run: python scripts/check_aycicek_names.py
