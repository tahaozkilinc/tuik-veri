name: Deploy Dashboard (GitHub Pages)

on:
  push:
    branches: [claude/gallant-keller-04r3vb, main]
    paths:
      - "dashboard/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# deploy-pages, aynı işte hemen önce yüklenen artifact'ı bazen henüz göremiyor
# ("No artifacts named github-pages were found" — GitHub tarafında gecikme).
# Yükleme ve yayınlama ayrı işlere bölündü (aradaki iş geçişi gecikmeyi
# karşılıyor) ve yayınlama artan beklemelerle iki kez daha deneniyor; iş
# ancak üç deneme de başarısız olursa düşüyor.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.d1.outcome == 'failure'
        run: sleep 45

      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        run: sleep 90

      - id: d3
        if: steps.d1.outcome == 'failure' && steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
