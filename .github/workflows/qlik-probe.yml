name: Qlik Engine Probe (debug)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests websockets==12.0

      - name: Run Qlik Engine probe
        run: python scripts/qlik_probe.py
