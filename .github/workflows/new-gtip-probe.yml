name: New GTİP Codes Probe (debug)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright==1.48.0
          playwright install --with-deps chromium

      - name: Probe candidate GTİP codes (crude/refined oils), no writes
        run: python scripts/new_gtip_probe.py
