name: WASDE Source Probe (debug)

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe WASDE source (usda.library.cornell.edu), no writes
        run: python scripts/wasde_probe.py

      - name: Upload raw WASDE files for local inspection
        uses: actions/upload-artifact@v4
        with:
          name: wasde-raw
          path: |
            wasde_page.html
            wasde_latest.txt
          retention-days: 3
