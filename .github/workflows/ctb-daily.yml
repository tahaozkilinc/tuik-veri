name: Daily ÇTB Price Fetch

on:
  schedule:
    # Kullanıcının açık talebi: her akşam 18:00 TR'de çekilsin.
    # 15:00 UTC = 18:00 TR. ÇTB'nin /Bulten/Aralik endpoint'i KTB'deki gibi
    # statik bir "bülten yayını" değil, o ana kadar kaydedilmiş işlemlerden
    # CANLI hesaplanan bir sorgu — bu yüzden KTB'nin "önce sorulursa hep 0
    # satır" riski yapısal olarak yok (bkz. ctb/run.py docstring). Yine de
    # ctb/run.py varsayılan olarak hem bugünü hem dünü çekip yazıyor, böylece
    # 18:00'dan sonra kaydedilen geç işlemler ertesi günün çalıştırmasında
    # otomatik düzeltiliyor.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Tek bir günü çek (YYYY-MM-DD), boş bırakılırsa bugün+dün"
        required: false
        default: ""
      backfill_days:
        description: "Son N günü tek tek çek (1 yıllık geçmiş doldurmak için 365 yazın)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install supabase==2.31.0

      - name: Fetch + parse + load ÇTB fiyatları
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CTB_DATE: ${{ github.event.inputs.date }}
          CTB_BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: |
          if [ -n "$CTB_BACKFILL_DAYS" ] && [ "$CTB_BACKFILL_DAYS" != "0" ]; then
            python -m ctb.run --backfill-days "$CTB_BACKFILL_DAYS"
          elif [ -n "$CTB_DATE" ]; then
            python -m ctb.run --date "$CTB_DATE"
          else
            python -m ctb.run
          fi
